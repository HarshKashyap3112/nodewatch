services:
  # ----------------------------------------------------------------------------
  # NodeWatch Backend - FastAPI Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: nodewatch-backend
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements/base.txt

    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGINS
        value: '["*"]'


  # ----------------------------------------------------------------------------
  # NodeWatch Frontend - React + Vite Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: nodewatch-frontend
    runtime: static

    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        sync: false